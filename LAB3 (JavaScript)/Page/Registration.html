<!DOCTYPE html>
<html lang="eng">

<title>Student Registration Page</title>
<body>
    <link rel="stylesheet" href="D:\Web Tech\LAB2 (HTML & CSS)\Design\Style.css">

<head>
    <script src="D:\Web Tech\LAB3 (JavaScript)\JS\Script.js"></script>
    <h1>Student Registration Page</h1>
</head>

<form>
    
    <label for="StudentName">Student Name:</label>
    <input type="text" id="StudentName" name="StudentName" placeholder="Enter Your Name">
    <br><br>

    <label for="StudentCGPA">Student CGPA:</label>
    <input type="text" id="StudentCGPA" name="StudentCGPA" placeholder="Enter Your CGPA">
    <br><br>

    <label for="GenderMale">Male</label>
    <input type="radio" id="GenderMale" name="Gender" value="Male">
    <br><br>
    
    <label for="GenderFemale">Female</label>
    <input type="radio" id="GenderFemale" name="Gender" value="Female">
    <br><br>

    <label for="Department">Select Department:</label>
    <select>
        <option value="CSE">CSE</option>
        <option value="EEE">EEE</option>
        <option value="BBA">BBA</option>
        <option value="IPE">IPE</option>
    </select>
    <br><br>

    <label for="StudentId">Student ID:</label>
    <input type="text" id="StudentId" name="StudentId">
    <br><br>

    <label for="Address">Address:</label>
    <textarea id="Address" name="Address" rows="4" cols="30" placeholder="Enter your address here"></textarea>
    <br><br>

    <label for="DOB">Date of Birth:</label>
    <input type="date" id="DOB" name="StudentDOB">
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" placeholder="Enter your email">
    <br><br>

    <label for="InsertFile">Upload your Grade Report:</label>
    <input type="file" id="InsertFile" name="InsertFile">
    <br><br>

    <label for="Agreement">I agree to the terms and conditions</label>
    <input type="checkbox" id="Agreement" name="Agreement">
    <br><br>

    <label for="Phone">Phone Number:</label>
    <input type="tel" id="Phone" name="Phone" placeholder="Enter your phone number">
    <br><br>

    <label for="Submit">Submit your information</label>
    <br>
    <input type="submit" value="Submit">

</form>

    
</body>
</html>
